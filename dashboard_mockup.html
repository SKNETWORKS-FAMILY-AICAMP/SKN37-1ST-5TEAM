    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",Arial,sans-serif}.app{min-height:100vh}.sidebar{width:270px;position:fixed;inset:0 auto 0 0;background:var(--side);border-right:1px solid var(--line);padding:22px 18px;transition:transform .2s}.sidebar.hidden{transform:translateX(-100%)}.main{margin-left:270px;padding:30px 45px;width:calc(100% - 270px);transition:margin-left .2s,width .2s}.main.wide{margin-left:0;width:100%}.nav-toggle{position:fixed;left:18px;bottom:20px;border:1px solid var(--line);border-radius:9px;background:#16212c;color:var(--text);padding:9px 11px;cursor:pointer;z-index:2}.sidebar.hidden+.main .nav-toggle{left:18px}.kicker{font-size:11px;letter-spacing:.18em;color:var(--mint);font-weight:800}.brand{font-size:25px;font-weight:800;margin:5px 0 28px}.side-btn{display:block;width:100%;padding:13px 15px;margin:7px 0;background:#151e29;border:1px solid var(--line);border-radius:12px;color:var(--text);font-weight:700;text-align:left;cursor:pointer}.side-btn.active{border-color:var(--mint);color:var(--mint)}.expander{display:none;padding:5px 0 8px 10px}.expander.open{display:block}.sub-btn{display:block;width:100%;padding:9px 10px;background:transparent;border:0;border-radius:8px;color:var(--muted);text-align:left;cursor:pointer}.sub-btn:hover,.sub-btn.active{background:#182b31;color:var(--mint)}.view,.pane{display:none}.view.active,.pane.active{display:block}.hero{padding:27px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#111b27,#0b1017);margin-bottom:20px}.hero h1{font-size:36px;margin:8px 0}.muted{color:var(--muted)}.home-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}.home-card{min-height:260px;text-align:left;padding:28px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);cursor:pointer}.home-card:hover{border-color:var(--mint);transform:translateY(-2px)}.home-card h2{font-size:28px;margin:12px 0}.home-card p{color:var(--muted);line-height:1.7}.home-card .go{color:var(--mint);font-weight:700}.tabs{display:flex;border-bottom:1px solid #344454;margin:20px 0 17px}.tab{padding:12px 19px;background:transparent;border:0;border-right:1px solid #344454;color:#aab7c5;cursor:pointer;font-weight:700}.tab.active{color:var(--mint);border-bottom:3px solid var(--mint)}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:13px 0}.controls label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}.controls select{width:108px;min-width:108px;background:#111923;border:1px solid var(--line);border-radius:9px;padding:9px;color:var(--text)}.controls select.sigu{width:130px;min-width:130px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px}.panel h3{margin:0 0 12px}.bar{display:flex;align-items:center;gap:10px;margin:12px 0}.bar label{width:110px;color:var(--muted);font-size:13px}.track{height:14px;background:#202c38;flex:1;border-radius:15px}.fill{height:100%;border-radius:15px}.value{width:100px;text-align:right;font-size:13px}.chart-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px;margin-top:15px}.donut-box{display:flex;align-items:center;justify-content:center;min-height:230px}.donut-legend{font-size:13px;color:var(--muted);line-height:1.9}.legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.map-wrap{position:relative;height:420px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;background:#15202a}.map-wrap img{max-height:100%;max-width:100%;object-fit:contain;filter:brightness(.8) contrast(1.05)}.map-dot{position:absolute;width:15px;height:15px;border:2px solid white;border-radius:50%;background:var(--mint);transform:translate(-50%,-50%);cursor:pointer}.map-dot.selected{box-shadow:0 0 0 5px rgba(53,208,186,.28);background:var(--orange)}.map-tip{font-size:12px;color:var(--muted);margin:8px 0 0}table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);margin-top:15px}th,td{padding:10px;border-bottom:1px solid #24313e;text-align:left}th{color:var(--mint);font-size:13px}td{font-size:13px}.download-row{display:flex;justify-content:flex-end;margin-top:10px}.download{background:#17242d;border:1px solid var(--mint);border-radius:8px;color:var(--mint);padding:9px 12px;cursor:pointer}.faq{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px}.status{font-size:12px;color:var(--muted);margin-top:8px}@media(max-width:850px){.sidebar{width:210px}.main{margin-left:210px;width:calc(100% - 210px);padding:22px}.layout,.chart-grid,.home-cards,.faq{grid-template-columns:1fr}.map-wrap{height:340px}}
    .home-intro{padding:12px 0 28px}.home-intro h1{font-size:42px;margin:0 0 12px}.car-intro{padding:12px 0 20px}.car-intro h1{font-size:36px;margin:8px 0}.date-picker{display:flex;flex-direction:column;background:#111923;border:1px solid var(--line);border-radius:10px;overflow:hidden}.date-section{padding:9px 12px}.date-section+.date-section{border-top:1px solid var(--line)}.date-label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.date-options{display:flex;flex-direction:column;gap:7px}.date-option-row{display:flex;gap:6px;flex-wrap:wrap}.date-options label{display:inline-flex;align-items:center;gap:3px;color:var(--text);font-size:12px;cursor:pointer}.criteria{margin:6px 0 16px;color:var(--muted)}.criteria strong{color:var(--text);margin-left:8px}.comparison-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.comparison-total{display:block;font-size:26px;margin:4px 0 12px}.dual-donut{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;text-align:center}.dual-donut svg{width:180px;max-width:100%}.shared-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;color:var(--muted);font-size:13px}.data-table-card{margin-top:15px}.table-scroll{max-height:430px;overflow-y:auto}.table-scroll table{margin-top:0}.num{text-align:right}.nav-toggle{position:absolute;top:16px;right:14px;left:auto;bottom:auto;border:0;background:transparent;color:var(--muted);font-size:21px;cursor:pointer}.nav-restore{display:none;position:fixed;top:16px;left:16px;border:1px solid var(--line);border-radius:8px;background:var(--side);color:var(--muted);padding:6px 9px;cursor:pointer;z-index:3}.nav-restore.show{display:block}

</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],num=v=>Number(String(v).replace(/,/g,""))||0,fmt=v=>num(v).toLocaleString("ko-KR")+"대";
let rows=[];
let sigunguAliases={};
const state={all:{years:[],months:[],sido:"전체",sigungu:"전체"},region:{years:[],months:[],sido:"전체",sigungu:"전체"},usage:{years:[],months:[],sido:"전체",usage:"전체"},fuel:{years:[],months:[],sido:"전체",fuel:"전체"},gender:{years:[],months:[],sido:"전체",gender:"전체",age:"전체"}};
const sharedFilters={years:[],months:[],sido:"전체"};
function normalizeAgeLabel(value){const raw=String(value||"전체").trim(),compact=raw.replace(/\s+/g,"");if(compact==="10대이하")return"10대 이하";if(compact==="90대이상")return"90대 이상";if(compact==="합")return"계";return raw}
function parseCSV(text){const lines=text.trim().split(/\r?\n/),head=lines.shift().split(",");return lines.map(line=>{const cols=line.split(","),o={};head.forEach((h,i)=>o[h]=cols[i]||"전체");return{period:o["기준년월"].slice(0,7),sido:o["시도"],sigungu:o["시군구"],usage:o["용도"],fuel:o["연료"],gender:o["성별"],age:normalizeAgeLabel(o["연령대"]),size:o["규모"],count:num(o["등록대수"])};});}
const isOverall=r=>r.sigungu==="전체"&&r.usage==="전체"&&r.fuel==="전체"&&r.gender==="전체"&&r.age==="전체"&&r.size==="전체";
const isRegion=r=>r.usage==="전체"&&r.fuel==="전체"&&r.gender==="전체"&&r.age==="전체"&&r.size==="전체";
const isUsage=r=>r.sigungu==="전체"&&r.fuel==="전체"&&r.gender==="전체"&&r.age==="전체"&&r.size==="전체";
const isFuel=r=>r.sigungu==="전체"&&r.usage==="전체"&&r.gender==="전체"&&r.age==="전체"&&r.size==="전체";
const isGender=r=>r.sigungu==="전체"&&r.usage==="전체"&&r.fuel==="전체"&&r.size==="전체";
function sigunguAliasKey(name){return String(name).trim().replace(/시(?=\s)/g,"").replace(/[시군구]$/g,"").replace(/\s+/g,"")}
function sigunguAdminMarkerCount(name){return(String(name).match(/시(?=\s|$)|[군구]$/g)||[]).length}
function buildSigunguAliases(data){const labelsBySido=new Map();data.forEach(row=>{if(isRegion(row)&&row.sigungu!=="전체"){if(!labelsBySido.has(row.sido))labelsBySido.set(row.sido,new Set());labelsBySido.get(row.sido).add(row.sigungu)}});const aliases={};labelsBySido.forEach((labels,sido)=>{const groups=new Map();labels.forEach(name=>{const key=sigunguAliasKey(name);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(name)});groups.forEach(names=>{if(names.length<2)return;const canonical=[...names].sort((a,b)=>sigunguAdminMarkerCount(a)-sigunguAdminMarkerCount(b)||a.length-b.length||a.localeCompare(b,"ko"))[0];names.forEach(name=>{if(name!==canonical)aliases[sido+"|"+name]=canonical})})});return aliases}
function canonicalSigungu(sido,name){return sigunguAliases[sido+"|"+name]||name}
function normalizeRegionRows(data){const byKey=new Map();data.forEach(row=>{const name=canonicalSigungu(row.sido,row.sigungu);const key=[row.period,row.sido,name].join("|");const current=byKey.get(key);if(!current||row.sigungu===name&&current.sourceName!==name)byKey.set(key,{row:{...row,sigungu:name},sourceName:row.sigungu})});return[...byKey.values()].map(item=>item.row)}
const unique=a=>[...new Set(a)].filter(v=>v&&v!=="전체").sort();
function optionList(values,current){return["전체",...unique(values)].map(v=>`<option value="${v}" ${v===current?"selected":""}>${v}</option>`).join("")}
function field(id,label,values,value,cls="",key="",disabled=false){return`<label>${label}<select id="${id}" class="${cls}" data-key="${key}" ${disabled?"disabled":""}>${optionList(values,value)}</select></label>`}
function fixedField(id,label,value){return`<label>${label}<select id="${id}" disabled><option selected>${value}</option></select></label>`}
function datePicker(mode){const years=unique(rows.map(r=>r.period.slice(0,4))),months=Array.from({length:12},(_,index)=>String(index+1).padStart(2,"0")),check=(value,chosen,key)=>`<label><input type="checkbox" value="${value}" data-date-key="${key}" ${chosen.includes(value)?"checked":""}>${value}</label>`,section=(label,values,chosen,key)=>`<div class="date-section"><span class="date-label">${label}</span><div class="date-options"><div class="date-option-row">${check("전체",chosen,key)}</div><div class="date-option-row">${values.map(v=>check(v,chosen,key)).join("")}</div></div></div>`,sidos=["전체",...unique(rows.map(r=>r.sido).filter(v=>v!=="계"))],sidoSection=`<div class="date-section"><span class="date-label">시도</span><div class="date-options"><div class="date-option-row">${sidos.map(v=>`<label><input type="radio" name="shared-sido-radio" value="${v}" ${sharedFilters.sido===v?"checked":""}>${v}</label>`).join("")}</div></div></div>`;return`<div class="date-picker">${section("년",years,sharedFilters.years,"year")}${section("월",months,sharedFilters.months,"month")}${sidoSection}</div>`}
function monthLimit(){const years=sharedFilters.years.filter(value=>value!=="전체");return years.length===2?1:2}
function updateDate(mode,key,value,checked){const prop=key==="year"?"years":"months";let values=[...sharedFilters[prop]];if(value==="전체"){values=checked?["전체"]:[]}else{values=values.filter(v=>v!=="전체");if(checked){const limit=key==="year"?2:monthLimit();if(values.length<limit)values.push(value)}else values=values.filter(v=>v!==value)}sharedFilters[prop]=values;if(key==="year"&&sharedFilters.months.length>monthLimit())sharedFilters.months=sharedFilters.months.includes("전체")?["전체"]:[sharedFilters.months[0]];syncCarFilters(mode)}
function syncCarFilters(sourceMode,sidoChanged=false){["all","region","usage","fuel","gender"].forEach(mode=>{state[mode].years=[...sharedFilters.years];state[mode].months=[...sharedFilters.months];state[mode].sido=sharedFilters.sido;if(sidoChanged&&mode==="region")state[mode].sigungu="전체"})}
function sourceFor(mode){if(mode==="all")return rows.filter(isOverall);if(mode==="region")return rows.filter(isRegion);if(mode==="usage")return rows.filter(isUsage);if(mode==="fuel")return rows.filter(isFuel);return rows.filter(isGender)}
function controls(mode){const s={...state[mode],...sharedFilters},src=sourceFor(mode),parts=[];
  if(mode==="region"){const siguSource=rows.filter(isRegion),sigus=s.sido==="전체"?[]:unique(siguSource.filter(r=>r.sido===s.sido&&r.sigungu!=="전체").map(r=>canonicalSigungu(r.sido,r.sigungu)));parts.push(field(`${mode}-sigungu`,`시군구`,sigus,s.sigungu,"sigu","sigungu",s.sido==="전체"));}
  if(mode==="usage")parts.push(field("usage-choice","용도",src.map(r=>r.usage),s.usage,"","usage")); if(mode==="fuel")parts.push(field("fuel-choice","연료",src.map(r=>r.fuel),s.fuel,"","fuel")); if(mode==="gender"){parts.push(field("gender-choice","성별",src.map(r=>r.gender),s.gender,"","gender"));const ageRows=s.gender==="전체"?src:src.filter(r=>r.gender===s.gender),ages=ageRows.map(r=>r.age).filter(age=>s.gender==="기타"?age==="법인 및 사업자":age!=="법인 및 사업자");parts.push(s.gender==="기타"?fixedField("gender-age","연령대","법인 및 사업자"):field("gender-age","연령대",ages,s.age,"","age"));}
  return parts.length?`<div class="controls">${parts.join("")}</div>`:"";
}

    const percent=item.value/total*100;
    const middle=(offset+percent/2)/100*360-90;

    const y=(80+54*Math.sin(radians)+3).toFixed(1);

  }).join("");

function renderGender(){const d=genderRows(),g=group(d,"age"),cols=["period","sido","gender","age","count"],comparison=categoryComparison(d,"age","성별·연령별","var(--pink)");$("#genderPane").innerHTML=controls("gender")+(comparison||`<div class="chart-grid"><div class="panel"><h3>성별·연령별 등록대수</h3>${bars(g,"var(--pink)")}</div><div class="panel"><h3>연령대 구성비</h3>${donut(g)}</div></div>`)+tableArea("gender",d,cols);bind("gender",renderGender,genderRows,cols)}
let faq=[],activeFaqTab='all',activeFaqMain='전체',activeFaqSub='전체';
function escapeHtml(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function parseQuotedCsv(text){const records=[],row=[],source=text.replace(/^\uFEFF/,'');let field='',quoted=false;for(let i=0;i<source.length;i+=1){const char=source[i],next=source[i+1];if(char==='"'&&quoted&&next==='"'){field+='"';i+=1}else if(char==='"'){quoted=!quoted}else if(char===','&&!quoted){row.push(field);field=''}else if((char==='\n'||char==='\r')&&!quoted){if(char==='\r'&&next==='\n')i+=1;row.push(field);if(row.some(value=>value!==''))records.push([...row]);row.length=0;field=''}else field+=char}row.push(field);if(row.some(value=>value!==''))records.push(row);return records}
function parseFaqCsv(text){const [headers,...records]=parseQuotedCsv(text);if(!headers)throw new Error('FAQ CSV 헤더가 없습니다.');const names=headers.map(name=>name.trim().replace(/^\uFEFF/,'')),index=name=>names.indexOf(name),companyIndex=index('company'),questionIndex=index('question'),answerIndex=index('answer');if([companyIndex,questionIndex,answerIndex].some(value=>value<0))throw new Error('FAQ CSV 필수 열이 없습니다.');const mainIndex=index('category_main'),subIndex=index('category_sub'),keys={'현대':'hyundai','기아':'kia','쉐보레':'chevrolet'};return records.map(record=>{const company=(record[companyIndex]||'').trim();return[keys[company]||company,company,(record[questionIndex]||'').trim(),(record[answerIndex]||'').trim(),(record[mainIndex]||'').trim(),(record[subIndex]||'').trim()]}).filter(item=>item[0]&&item[2])}
function faqSelectOptions(values,selected){return['전체',...values].map(value=>`<option value="${escapeHtml(value)}" ${value===selected?'selected':''}>${escapeHtml(value)}</option>`).join('')}
function faqRender(which){activeFaqTab=which;$$('[data-faq-tab]').forEach(x=>x.classList.toggle('active',x.dataset.faqTab===which));$$('[data-faq]').forEach(x=>x.classList.toggle('active',x.dataset.faq===which));const companyView=faq.filter(x=>which==='all'||x[0]===which),mainValues=[...new Set(companyView.map(x=>x[4]||'미분류'))].sort();if(!['전체',...mainValues].includes(activeFaqMain))activeFaqMain='전체';const mainView=companyView.filter(x=>activeFaqMain==='전체'||(x[4]||'미분류')===activeFaqMain),subValues=[...new Set(mainView.map(x=>x[5]||'미분류'))].sort();if(!['전체',...subValues].includes(activeFaqSub))activeFaqSub='전체';const view=mainView.filter(x=>activeFaqSub==='전체'||(x[5]||'미분류')===activeFaqSub);$('#faqControls').innerHTML=`<label>대분류<select id="faqMain">${faqSelectOptions(mainValues,activeFaqMain)}</select></label><label>소분류<select id="faqSub">${faqSelectOptions(subValues,activeFaqSub)}</select></label>`;$('#faqMain').onchange=event=>{activeFaqMain=event.target.value;activeFaqSub='전체';faqRender(activeFaqTab)};$('#faqSub').onchange=event=>{activeFaqSub=event.target.value;faqRender(activeFaqTab)};$('#faqBody').innerHTML=view.length?view.map(x=>`<article class="card"><h3>${escapeHtml(x[1])}</h3><p>${escapeHtml(x[2])}</p><p class="muted">${escapeHtml(x[3])}</p></article>`).join(''):`<article class="card"><p class="muted">선택한 분류의 FAQ가 없습니다.</p></article>`}
function show(view){$$('.view').forEach(v=>v.classList.remove('active'));$('#'+view).classList.add('active');$('#carBtn').classList.toggle('active',view==='carView');$('#faqBtn').classList.toggle('active',view==='faqView');$('#carExp').classList.toggle('open',view==='carView');$('#faqExp').classList.toggle('open',view==='faqView')}

function carTab(tab){activeCarTab=tab;show('carView');renderSharedControls();$$('#carView .tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$$('#carView .pane').forEach(p=>p.classList.toggle('active',p.id===tab+'Pane'));$$('#carExp [data-open]').forEach(b=>b.classList.toggle('active',b.dataset.open===tab));({all:renderAll,region:renderRegion,usage:renderUsage,fuel:renderFuel,gender:renderGender})[tab]?.()}
$('#carBtn').onclick=()=>carTab('all');$('#faqBtn').onclick=()=>{show('faqView');faqRender('all')};$('#homeCar').onclick=()=>carTab('all');$('#homeFaq').onclick=()=>{show('faqView');faqRender('all')};$$('#carView [data-tab]').forEach(b=>b.onclick=()=>carTab(b.dataset.tab));$$('#carExp [data-open]').forEach(b=>b.onclick=()=>carTab(b.dataset.open));$$('[data-faq-tab]').forEach(b=>b.onclick=()=>{show('faqView');faqRender(b.dataset.faqTab)});$$('[data-faq]').forEach(b=>b.onclick=()=>{show('faqView');faqRender(b.dataset.faq)});

async function loadVehicleCsv(){for(const path of ['data/자동차_등록현황_통합_검증.csv','data/자동차_등록현황_통합.csv']){const response=await fetch(path);if(response.ok)return response.text()}throw new Error('CSV를 읽지 못했습니다.')}
async function loadFaqCsv(){const response=await fetch('data/faq_data_total.csv');if(!response.ok)throw new Error('FAQ CSV를 읽지 못했습니다.');return parseFaqCsv(await response.text())}
